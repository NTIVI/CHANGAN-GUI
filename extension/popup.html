<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      width: 280px;
      background: #0f0f0f;
      color: #e8e8e8;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }
    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #FF6B00, #CC4400);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(255, 107, 0, 0.4);
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #FF6B00;
      letter-spacing: 0.05em;
    }
    .subtitle {
      font-size: 11px;
      color: #888;
    }
    .btn-portal {
      width: 100%;
      background: linear-gradient(135deg, #FF6B00, #CC5500);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 107, 0, 0.35);
      transition: opacity 0.15s, transform 0.15s;
      margin-bottom: 12px;
    }
    .btn-portal:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-portal:active { transform: scale(0.97); }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #161616;
      border: 1px solid #242424;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .setting-label {
      font-size: 12px;
      font-weight: 600;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider {
      background: #FF6B00;
    }
    .toggle input:checked + .slider:before {
      transform: translateX(18px);
    }
    .btn-reset {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #aaa;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reset:hover { border-color: #FF6B00; color: #FF6B00; }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #555;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="title">CHANGAN.AM</div>
      <div class="subtitle">Автомобильный помощник</div>
    </div>
  </div>

  <button class="btn-portal" id="btn-open-portal">
    <span>Открыть портал</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>

  <div class="setting-item">
    <span class="setting-label">Кнопка на экранах</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-fab" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button class="btn-reset" id="btn-reset-pos">Сбросить позицию кнопки</button>

  <div class="footer">CHANGAN.AM Car Portal v2.0</div>

  <script src="popup.js"></script>
</body>
</html>
